name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write  # Gives permission to publish GitHub Releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        shell: powershell
        run: |
          if (Test-Path "dist") { Remove-Item -Recurse -Force "dist" }
          pyinstaller --noconsole --onedir --noupx --clean --name "AS400QuantumSuite" --paths=src --add-data "src/warning.wav;src" --add-data "src/alert.wav;src" --add-data "src/up.wav;src" --add-data "src/logo.png;src" --icon=src/logo.ico --collect-all PyQt6 src/main.py

      - name: Sign PyInstaller Output Binaries
        shell: powershell
        run: |
          # Create a self-signed code-signing certificate
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=AS400 Quantum Suite Code Signing" -CertStoreLocation "Cert:\CurrentUser\My"

          $buildDir = Get-ChildItem -Path "dist" -Directory -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -eq "AS400QuantumSuite" -or $_.Name -eq "AS400 Quantum Suite"
            } |
            Select-Object -First 1

          if (-not $buildDir) {
              throw "PyInstaller output directory not found under dist."
          }

          Write-Host "Signing files in: $($buildDir.FullName)"

          # Sign all executable and DLL files (including PyQt6 binaries) to pass AppLocker/WDAC policy checks
          Get-ChildItem -Path $buildDir.FullName -Recurse -Include *.exe, *.dll, *.pyd | ForEach-Object {
              Set-AuthenticodeSignature -FilePath $_.FullName -Certificate $cert
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build Installer
        run: |
          if (Test-Path service-account.json) {
            Remove-Item service-account.json -Force
          }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" setup.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AS400QuantumSuite-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}